:root{
  --papier:#FFFFFF;
  --text:#111111;
  --web-bg:#E8E3E4;
  --basis:13pt;
  --rubrik-f:2.6;
  --kopf:0mm;
  --deko-gr:34mm;
  --seitl:0mm;
  --gold:#a5853c;
  --lh:1.5;
  --e-gap:2.6mm;
  --r-gap:10mm;
  --schrift:'Chorus','Lucida Calligraphy','Monotype Corsiva','Apple Chancery',cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--web-bg);color:var(--text);font-family:var(--schrift);-webkit-text-size-adjust:100%}

/* ---------- Bedienleiste (nie im Druck) ---------- */
.ui{
  position:sticky;top:0;z-index:20;background:rgba(232,227,228,.96);
  backdrop-filter:blur(6px);border-bottom:1px solid #c9bcc0;
  padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  font-family:system-ui,-apple-system,'Segoe UI',sans-serif
}
.ui button{
  font:600 14px/1 system-ui,-apple-system,'Segoe UI',sans-serif;
  background:#60233a;color:#E8E3E4;border:0;border-radius:8px;
  padding:12px 14px;cursor:pointer;min-height:44px
}
.ui button.sek{background:transparent;color:#60233a;border:1.5px solid #60233a}
.ui button:active{transform:translateY(1px)}
.warnung{
  width:100%;font:400 13px/1.45 system-ui,-apple-system,'Segoe UI',sans-serif;
  border-radius:8px;padding:10px 12px;background:#fdecec;color:#7a1d1d;
  border:1px solid #e3b3b3;display:none;white-space:pre-line
}
.warnung.an{display:block}
.warnung.ok{background:#e8f3ec;color:#1d5a35;border-color:#b3d8c2}

.stage{padding:16px 12px 60px}
body.einbettung .ui{display:none}
body.imrahmen .ui{position:static;background:transparent;border:0;padding:10px 12px 0}
body.imrahmen #btnModus, body.imrahmen #btnFit{display:none}
body.einbettung .stage{padding:0 0 8px}
body.einbettung .deckblatt{display:none}
body.einbettung .blatt{box-shadow:none;margin-bottom:10px;border-bottom:1px solid #e2dcdd}
body.einbettung .blatt:last-child{border-bottom:0}
.scaler{transform-origin:top left}

/* ---------- Blatt ---------- */
.blatt{
  background:var(--papier);margin:0 auto 22px;max-width:760px;width:100%;
  padding:24px 20px 30px;box-shadow:0 2px 16px rgba(0,0,0,.10);
  font-size:16px;line-height:1.5
}
.blatt:last-child{margin-bottom:0}
.inhalt{width:100%}

h2.rt{
  font-size:2.1em;font-weight:400;text-align:center;
  margin:0 0 .35em;line-height:1.1
}
.rst{text-align:center;font-size:1.15em;margin:-.2em 0 .5em}
.rubrik{margin-bottom:var(--r-gap)}
.rubrik:last-child{margin-bottom:0}

/* Eintrag: Name links, Preis rechts */
.e{display:flex;align-items:baseline;justify-content:space-between;gap:1.4em;margin-bottom:var(--e-gap)}
.e .t{flex:1;min-width:0}
.n{-webkit-text-stroke:.6px currentColor}
.e .b{-webkit-text-stroke:0}
.e .p{white-space:nowrap;text-align:right}
.e .p .pz{display:block}
.abstand{height:.9em}

/* Getränke: Name | Menge | Preis */
.gr{display:grid;grid-template-columns:1fr max-content max-content;
    column-gap:1.6em;row-gap:var(--e-gap);align-items:baseline}
.gr .gn{grid-column:1}
.gr .gm{grid-column:2;text-align:left}
.gr .gp{grid-column:3;text-align:right;white-space:nowrap}
.gr .luecke{grid-column:1/-1;height:.7em}
.gr.wein{grid-template-columns:1fr max-content}
.gr.wein .gp{grid-column:2}
.gr.wein .tr{opacity:.4;margin:0 .5em;font-weight:400}
.hv{-webkit-text-stroke:.6px currentColor}

/* Spirituosen: zwei Spalten */
.zw{column-count:2;column-gap:2.4em}
.zw .e{break-inside:avoid}

/* Tee */
.zut{font-size:.72em;line-height:1.3;margin:-.35em 0 .9em}
.notiz{display:block;font-size:.68em;line-height:1.25}

.nachsatz{margin-top:.9em;font-size:.9em}
.nachsatz.mitte{text-align:center}
.stand{text-align:center;font-size:.7em;opacity:.5;margin-top:14px;
       font-family:system-ui,sans-serif}

/* ---------- Deckblatt ---------- */
.deckblatt .inhalt{text-align:center;padding-bottom:0}
.db-logo{display:block;margin:0 auto;width:80%;max-width:150mm;height:auto}
.db-wort{
  font-size:.9em;letter-spacing:.45em;text-indent:.45em;
  color:var(--gold);margin:.9em 0 .1em
}
.deckblatt .zierlinie{margin:.9em 0 0}
.db-gruss{font-size:1.14em;margin-top:2em;line-height:1.55}
.db-gruss .z2{display:block;font-size:.92em}
.db-text{margin-top:1.5em;line-height:1.6}
.db-wirt{margin-top:2em;line-height:1.5}
.db-wirt .name{display:block;color:var(--gold);font-size:1.12em;margin-top:.15em}
.db-sonntag{margin-top:2.1em;line-height:1.5}
.db-sonntag .lab{display:block;color:var(--gold);font-size:.85em}
.db-sonntag .ger{display:block;font-size:1.06em;margin-top:.2em}
.db-sonntag .pr{display:block;color:var(--gold);font-size:1.02em;margin-top:.1em}
.db-hinweis{margin-top:1.9em;font-size:.7em;opacity:.75}

/* ---------- Verzierung ---------- */
.blatt{position:relative}
.deko{position:absolute;pointer-events:none;color:var(--text);opacity:.3;width:28mm}
.deko.ul{left:3mm;bottom:3mm}
.deko.ur{right:3mm;bottom:3mm;transform:scaleX(-1)}
.deko svg{display:block;width:100%;height:auto}
.rahmen{position:absolute;pointer-events:none;color:var(--text);display:none}
body.a4 .rahmen{
  display:block;left:2mm;right:2mm;top:calc(var(--kopf) - 4mm);bottom:3mm;
  border:0.4pt solid currentColor;opacity:.4
}
.rahmen .ecke{position:absolute;width:11mm;opacity:.75}
.rahmen .ecke svg{display:block;width:100%;height:auto}
.rahmen .e1{left:-1mm;top:-1mm}
.rahmen .e2{right:-1mm;top:-1mm;transform:scaleX(-1)}
.rahmen .e3{left:-1mm;bottom:-1mm;transform:scaleY(-1)}
.rahmen .e4{right:-1mm;bottom:-1mm;transform:scale(-1,-1)}
.zierlinie{display:flex;align-items:center;justify-content:center;gap:.5em;margin:-.2em 0 .45em}
.zierlinie .li{width:18%;height:1px;background:currentColor;opacity:.35}
.zierlinie svg{width:1.4em;height:auto;flex:0 0 auto;opacity:.6}

/* ---------- Schmale Bildschirme: Umbruch statt Überlauf ---------- */
@media screen and (max-width:620px){
  body.web .blatt{padding-left:14px;padding-right:14px;overflow-x:hidden}
  body.web .gr{grid-template-columns:1fr max-content;column-gap:.8em}
  body.web .gr .gm{grid-column:2;text-align:right;font-size:.9em;opacity:.75}
  body.web .gr .gp{grid-column:2;text-align:right}
  body.web .gr.wein{grid-template-columns:1fr max-content}
  body.web .gr.wein .gp.lang{
    grid-column:1/-1;text-align:left;white-space:normal;
    font-size:.92em;opacity:.85;margin:-.4em 0 .3em
  }
  body.web .gr.wein .tr{margin:0 .35em}
  body.web .e .p{white-space:normal}
  body.web .e .p .pz{white-space:nowrap}
  body.web .zw{column-count:1}
  body.web .notiz{font-size:.75em}
}

/* ---------- A4-Vorschau ---------- */
body.a4 .stage{padding:14px 6px 60px}
body.a4 .blatt{
  width:190mm;max-width:none;height:276mm;padding:var(--kopf) var(--seitl) 0;
  font-size:var(--basis);line-height:var(--lh);
  margin:0 auto 14px;box-shadow:0 3px 18px rgba(0,0,0,.22);overflow:hidden;
  display:flex;flex-direction:column;justify-content:center
}
body.a4 .inhalt{padding-bottom:3%}
body.a4 .deko{width:var(--deko-gr)}
body.a4 h2.rt{font-size:calc(var(--rubrik-f) * 1em)}
body.a4 .stand{display:none}

/* ---------- Druck ---------- */
@media print{
  @page{size:A4 portrait;margin:10mm}
  body.einbettung .deckblatt{display:flex!important}
  body.web .rahmen, body.a4 .rahmen{
    display:block;left:2mm;right:2mm;top:calc(var(--kopf) - 4mm);bottom:3mm;
    border:0.4pt solid currentColor;opacity:.4
  }
  html,body{background:#fff}
  .ui,.stand{display:none!important}
  body.web .stage, body.a4 .stage{padding:0}
  .scaler{transform:none!important}
  body.web .blatt, body.a4 .blatt{
    width:auto;max-width:none;height:276mm;padding:var(--kopf) var(--seitl) 0;margin:0;
    box-shadow:none;font-size:var(--basis);line-height:var(--lh);
    break-after:page;overflow:hidden;
    display:flex;flex-direction:column;justify-content:center
  }
  body.web .inhalt, body.a4 .inhalt{padding-bottom:3%}
  body.web .deko, body.a4 .deko{width:var(--deko-gr)}
  body.web .blatt:last-child, body.a4 .blatt:last-child{break-after:auto}
  body.web h2.rt, body.a4 h2.rt{font-size:calc(var(--rubrik-f) * 1em)}
}
</style>
</head>

        { "name": "Doppelter Espresso Macchiato", "varianten": [{ "menge": "", "preis": 3.80 }], "sichtbar": true }
      ]
    }
  ],

  "hinweise": [],
  "zusatzstoffe": {}
};

</script>
<script>
(function(){
  "use strict";

  var eingebettet = /(^|[?&])einbettung(=|&|$)/.test(location.search) || window.EINBETTUNG === 1;
  if(eingebettet) document.body.classList.add('einbettung');
  if(window.parent !== window) document.body.classList.add('imrahmen');

  var D = window.SPEISEKARTE;
  var ziel = document.getElementById('karte');

  if(!D){
    ziel.innerHTML = '<div class="blatt">Datendatei <b>speisekarte.js</b> nicht gefunden. '
                   + 'Sie muss im selben Ordner liegen wie diese Seite.</div>';
    return;
  }

  var L = D.layout || {};
  var F = L.farben || {};

  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function preis(v){
    if(v == null || v === '') return '';
    var n = Number(v);
    if(isNaN(n)) return esc(v);
    return n.toFixed(2).replace('.', ',') + '\u00A0' + esc(L.waehrung || '€');
  }
  function sichtbar(o){ return o && o.sichtbar !== false; }

  /* ---------- Layoutwerte übernehmen ---------- */
  var root = document.documentElement.style;
  if(F.papier)          root.setProperty('--papier', F.papier);
  if(F.text)            root.setProperty('--text', F.text);
  if(F.web_hintergrund) root.setProperty('--web-bg', F.web_hintergrund);
  if(L.schriftstack)    root.setProperty('--schrift', L.schriftstack);

  var basisStart = Number(L.basis_pt) || 13;
  function setBasis(pt){
    root.setProperty('--basis', pt + 'pt');
  }
  root.setProperty('--rubrik-f', String((Number(L.rubrik_pt) || 39) / basisStart));
  root.setProperty('--kopf', (Number(L.kopf_freiraum_mm) || 0) + 'mm');
  root.setProperty('--deko-gr', (Number(L.verzierung_groesse_mm) || 34) + 'mm');
  root.setProperty('--seitl', ((L.verzierung === 'rahmen') ? 9 : 0) + 'mm');
  setBasis(basisStart);
  root.setProperty('--lh',    String(Number(L.zeilenabstand) || 1.5));
  root.setProperty('--e-gap',(Number(L.eintrag_abstand_mm) || 2.6) + 'mm');
  root.setProperty('--r-gap',(Number(L.rubrik_abstand_mm)  || 10)  + 'mm');

  /* ---------- Rubriken zu Blättern gruppieren ---------- */
  var rubriken = (D.rubriken || []).filter(function(r){
    return sichtbar(r) && (r.gerichte || []).filter(sichtbar).length > 0;
  });

  var blaetter = [];
  rubriken.forEach(function(r, i){
    if(i === 0 || r.neue_seite) blaetter.push([]);
    blaetter[blaetter.length - 1].push(r);
  });

  /* ---------- Darstellungen ---------- */
  function preisBlock(g){
    if(g.varianten && g.varianten.length){
      return g.varianten.map(function(v){
        return '<span class="pz">' + (v.menge ? esc(v.menge) + ' ' : '') + preis(v.preis) + '</span>';
      }).join('');
    }
    return preis(g.preis);
  }

  function eintragSpeise(g){
    var h = '';
    if(g.abstand_davor) h += '<div class="abstand"></div>';
    h += '<div class="e' + (g.hervorgehoben ? ' hv' : '') + '">';
    h += '<span class="t"><span class="n">' + esc(g.name) + '</span>';
    if(g.beschreibung) h += ' <span class="b">' + esc(g.beschreibung) + '</span>';
    if(g.notiz) h += '<span class="notiz">' + esc(g.notiz) + '</span>';
    h += '</span>';
    h += '<span class="p">' + preisBlock(g) + '</span></div>';
    return h;
  }

  function blockGetraenke(gerichte){
    var h = '<div class="gr">';
    gerichte.forEach(function(g){
      if(g.abstand_davor) h += '<div class="luecke"></div>';
      var vs = (g.varianten && g.varianten.length)
             ? g.varianten
             : [{ menge: '', preis: g.preis }];
      vs.forEach(function(v, i){
        var kl = g.hervorgehoben ? ' hv' : '';
        h += '<span class="gn' + kl + '">' + (i === 0 ? '<span class="n">' + esc(g.name) + '</span>' : '')
           + (i === 0 && g.notiz ? '<span class="notiz">' + esc(g.notiz) + '</span>' : '')
           + '</span>';
        h += '<span class="gm' + kl + '">' + esc(v.menge || '') + '</span>';
        h += '<span class="gp' + kl + '">' + preis(v.preis) + '</span>';
      });
    });
    return h + '</div>';
  }

  function blockWein(gerichte){
    var h = '<div class="gr wein">';
    gerichte.forEach(function(g){
      if(g.abstand_davor) h += '<div class="luecke"></div>';
      h += '<span class="gn"><span class="n">' + esc(g.name) + '</span>'
         + (g.notiz ? '<span class="notiz">' + esc(g.notiz) + '</span>' : '') + '</span>';
      var vs = (g.varianten && g.varianten.length) ? g.varianten : [{ menge: '', preis: g.preis }];
      h += '<span class="gp' + (vs.length > 1 ? ' lang' : '') + '">' + vs.map(function(v){
             return (v.menge ? esc(v.menge) + ' ' : '') + preis(v.preis);
           }).join('<span class="tr">·</span>') + '</span>';
    });
    return h + '</div>';
  }

  function blockZweispaltig(gerichte){
    return '<div class="zw">' + gerichte.map(function(g){
      return '<div class="e"><span class="t"><span class="n">' + esc(g.name) + '</span></span>'
           + '<span class="p">' + preisBlock(g) + '</span></div>';
    }).join('') + '</div>';
  }

  function blockTee(gerichte){
    return gerichte.map(function(g){
      var h = '<div class="e"><span class="t"><span class="n">' + esc(g.name) + '</span></span>'
            + '<span class="p">' + preisBlock(g) + '</span></div>';
      if(g.zutaten) h += '<div class="zut">' + esc(g.zutaten) + '</div>';
      return h;
    }).join('');
  }


  /* ---------- Verzierungen ---------- */
  var SPRITZER = {
    ranke: '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'
      + '<g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">'
      + '<path d="M6 114 C 30 104, 52 86, 68 62 C 80 44, 90 28, 96 12"/>'
      + '<path d="M40 92 C 34 78, 38 66, 50 60"/>'
      + '<path d="M62 68 C 60 54, 66 44, 78 40"/>'
      + '<path d="M78 44 C 88 46, 96 42, 100 32"/>'
      + '</g>'
      + '<g fill="currentColor">'
      + '<path d="M50 60 C 60 52, 68 54, 70 62 C 62 70, 53 69, 50 60 Z"/>'
      + '<path d="M50 60 C 44 50, 46 41, 54 37 C 60 45, 58 55, 50 60 Z"/>'
      + '<path d="M78 40 C 88 33, 96 35, 98 43 C 90 50, 81 48, 78 40 Z"/>'
      + '<path d="M100 32 C 105 22, 113 19, 118 24 C 114 33, 106 37, 100 32 Z"/>'
      + '<path d="M34 96 C 24 92, 18 84, 21 76 C 31 79, 37 87, 34 96 Z"/>'
      + '</g></svg>',
    bogen: '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'
      + '<g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">'
      + '<path d="M4 116 L4 46 C 4 22, 22 4, 46 4 L 116 4"/>'
      + '<path d="M12 116 L12 48 C 12 28, 28 12, 48 12 L 116 12"/>'
      + '<path d="M4 46 C 16 46, 24 38, 24 26"/>'
      + '<path d="M46 4 C 46 16, 38 24, 26 24"/>'
      + '</g>'
      + '<circle cx="25" cy="25" r="3.2" fill="currentColor"/></svg>',
    blatt: '<svg viewBox="0 0 40 20" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'
      + '<g fill="currentColor">'
      + '<path d="M20 3 C 27 6, 31 10, 20 17 C 9 10, 13 6, 20 3 Z"/>'
      + '<path d="M2 10 C 8 7, 13 9, 15 10 C 13 11, 8 13, 2 10 Z"/>'
      + '<path d="M38 10 C 32 7, 27 9, 25 10 C 27 11, 32 13, 38 10 Z"/>'
      + '</g></svg>'
  };

  SPRITZER.ecke = '<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'
    + '<g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">'
    + '<path d="M2 46 C 14 44, 24 36, 30 24 C 34 16, 40 8, 50 4"/>'
    + '<path d="M18 40 C 14 32, 16 25, 24 22"/>'
    + '<path d="M32 20 C 32 12, 37 7, 45 6"/></g>'
    + '<g fill="currentColor">'
    + '<path d="M24 22 C 32 16, 39 18, 40 25 C 33 31, 26 29, 24 22 Z"/>'
    + '<path d="M24 22 C 19 14, 21 7, 28 4 C 33 11, 31 19, 24 22 Z"/>'
    + '<path d="M45 6 C 51 1, 57 2, 58 7 C 53 12, 47 11, 45 6 Z"/>'
    + '<path d="M14 44 C 7 41, 3 35, 5 29 C 12 32, 16 38, 14 44 Z"/>'
    + '</g></svg>';

  var dekoStil = (L.verzierung || 'ranke');
  function dekoEcken(){
    if(dekoStil === 'keine') return '';
    if(dekoStil === 'rahmen'){
      var e = SPRITZER.ecke;
      return '<div class="rahmen">'
        + '<div class="ecke e1">' + e + '</div><div class="ecke e2">' + e + '</div>'
        + '<div class="ecke e3">' + e + '</div><div class="ecke e4">' + e + '</div></div>';
    }
    var g = SPRITZER[dekoStil] || SPRITZER.ranke;
    return '<div class="deko ul">' + g + '</div><div class="deko ur">' + g + '</div>';
  }
  function zierlinie(){
    if(dekoStil === 'keine') return '';
    return '<div class="zierlinie"><span class="li"></span>' + SPRITZER.blatt + '<span class="li"></span></div>';
  }

  /* ---------- Aufbau ---------- */

  /* ---------- Deckblatt ---------- */
  function deckblatt(){
    var D2 = D.deckblatt;
    if(!D2 || D.deckblatt_aus) return '';
    var h = '<section class="blatt deckblatt">' + dekoEcken() + '<div class="inhalt">';
    if(D2.logo) h += '<img class="db-logo" src="' + esc(D2.logo) + '" alt="' + esc((D.meta || {}).betrieb || '') + '">';
    if(D2.wortmarke) h += '<div class="db-wort">' + esc(D2.wortmarke) + '</div>';
    h += zierlinie();
    if(D2.gruss && D2.gruss.length){
      h += '<div class="db-gruss">' + esc(D2.gruss[0]);
      if(D2.gruss[1]) h += '<span class="z2">' + esc(D2.gruss[1]) + '</span>';
      h += '</div>';
    }
    if(D2.text) h += '<div class="db-text">' + esc(D2.text).replace(/\n/g, '<br>') + '</div>';
    if(D2.wirtsleut){
      h += '<div class="db-wirt">' + esc(D2.wirtsleut_label || '')
         + '<span class="name">' + esc(D2.wirtsleut) + '</span></div>';
    }
    if(D2.sonntag_gericht){
      h += '<div class="db-sonntag">'
         + (D2.sonntag_label ? '<span class="lab">' + esc(D2.sonntag_label) + '</span>' : '')
         + '<span class="ger">' + esc(D2.sonntag_gericht) + '</span>'
         + '<span class="pr">' + preis(D2.sonntag_preis) + '</span></div>';
    }
    if(D2.hinweis) h += '<div class="db-hinweis">' + esc(D2.hinweis) + '</div>';
    return h + '</div></section>';
  }

  var html = deckblatt();
  blaetter.forEach(function(seite){
    html += '<section class="blatt">' + dekoEcken() + '<div class="inhalt">';
    seite.forEach(function(r, ri){
      var gerichte = (r.gerichte || []).filter(sichtbar);
      html += '<div class="rubrik">';
      if(r.titel)     html += '<h2 class="rt">' + esc(r.titel) + '</h2>';
      if(r.untertitel) html += '<div class="rst">' + esc(r.untertitel) + '</div>';
      if(ri === 0 && r.titel) html += zierlinie();

      switch(r.darstellung){
        case 'getraenke':   html += blockGetraenke(gerichte); break;
        case 'wein':
        case 'einzeilig':   html += blockWein(gerichte); break;
        case 'zweispaltig': html += blockZweispaltig(gerichte); break;
        case 'tee':         html += blockTee(gerichte); break;
        default:            html += gerichte.map(eintragSpeise).join('');
      }

      if(r.nachsatz) html += '<div class="nachsatz' + (r.nachsatz_zentriert ? ' mitte' : '')
                       + '">' + esc(r.nachsatz) + '</div>';
      html += '</div>';
    });
    html += '</div></section>';
  });

  if((D.meta || {}).stand){
    html += '<div class="stand">Stand: ' + esc(D.meta.stand) + '</div>';
  }
  ziel.innerHTML = html;

  /* ---------- Rubrikgrößen je Rubrik überschreiben ---------- */
  var rubrikEls = ziel.querySelectorAll('.rubrik');
  rubriken.forEach(function(r, i){
    if(r.basis_pt && rubrikEls[i]) rubrikEls[i].dataset.basis = r.basis_pt;
  });
  function rubrikGroessen(faktor){
    rubriken.forEach(function(r, i){
      if(r.basis_pt && rubrikEls[i]) rubrikEls[i].style.fontSize = (r.basis_pt * faktor) + 'pt';
    });
  }
  rubrikGroessen(1);

  /* ---------- Modus, Skalierung, Passt-Prüfung ---------- */
  var body   = document.body;
  var scaler = document.getElementById('scaler');
  var btnMod = document.getElementById('btnModus');
  var btnFit = document.getElementById('btnFit');
  var warn   = document.getElementById('warn');
  var a4     = false;

  function blaetterEls(){ return ziel.querySelectorAll('.blatt'); }

  function skalieren(){
    scaler.style.transform = '';
    scaler.style.height = '';
    if(!a4) return;
    var verfuegbar = scaler.clientWidth || scaler.parentElement.clientWidth;
    var el = blaetterEls()[0];
    if(!el) return;
    var breite = el.offsetWidth;
    if(!breite) return;
    var f = Math.min(1, verfuegbar / breite);
    if(f < 1){
      scaler.style.transform = 'scale(' + f + ')';
      scaler.style.height = (ziel.offsetHeight * f) + 'px';
    }
  }

  function uebervoll(){
    var raus = [];
    blaetterEls().forEach(function(el, i){
      var inh = el.querySelector('.inhalt');
      var oben = parseFloat(getComputedStyle(el).paddingTop) || 0;
      if(inh && inh.offsetHeight > el.clientHeight - oben + 2) raus.push(i + 1);
    });
    return raus;
  }

  function dekoPruefen(){
    if(dekoStil !== 'ranke' && dekoStil !== 'bogen') return;
    blaetterEls().forEach(function(el){
      var inh = el.querySelector('.inhalt');
      var ecken = el.querySelectorAll('.deko');
      if(!inh || !ecken.length) return;
      ecken.forEach(function(d){ d.style.visibility = ''; });
      var frei = el.getBoundingClientRect().bottom - inh.getBoundingClientRect().bottom;
      var noetig = ecken[0].offsetHeight + 14;
      if(frei < noetig) ecken.forEach(function(d){ d.style.visibility = 'hidden'; });
    });
  }

  function pruefen(){
    dekoPruefen();
    if(!a4){ warn.className = 'warnung'; warn.textContent = ''; return; }
    var raus = uebervoll();
    var n = blaetterEls().length;
    if(!raus.length){
      warn.className = 'warnung an ok';
      warn.textContent = 'Alles passt: ' + n + ' A4-Seiten.';
    } else {
      warn.className = 'warnung an';
      warn.textContent = 'Zu viel Inhalt auf Seite ' + raus.join(', ') + ' von ' + n + '.\n'
        + 'Auto-Anpassen drücken, oder in speisekarte.js "basis_pt" verkleinern bzw. '
        + 'bei der betroffenen Rubrik ein eigenes "basis_pt" setzen.';
    }
  }

  function autofit(){
    var pt = basisStart;
    setBasis(pt); rubrikGroessen(1);
    var min = 7;
    while(uebervoll().length && pt > min){
      pt = Math.round((pt - 0.2) * 10) / 10;
      setBasis(pt);
      rubrikGroessen(pt / basisStart);
    }
    skalieren();
    var n = blaetterEls().length;
    if(!uebervoll().length){
      warn.className = 'warnung an ok';
      warn.textContent = 'Passt bei ' + String(pt).replace('.', ',') + ' pt auf ' + n + ' Seiten.\n'
                       + 'Diesen Wert als "basis_pt" in speisekarte.js eintragen.';
    } else {
      warn.className = 'warnung an';
      warn.textContent = 'Auch bei ' + min + ' pt passt Seite ' + uebervoll().join(', ')
                       + ' nicht. Rubrik aufteilen oder eine Seite mehr vorsehen.';
    }
  }

  btnMod.addEventListener('click', function(){
    a4 = !a4;
    body.className = a4 ? 'a4' : 'web';
    btnMod.textContent = a4 ? 'Web-Ansicht' : 'A4-Druckansicht';
    btnFit.hidden = !a4;
    setBasis(basisStart); rubrikGroessen(1);
    skalieren(); pruefen();
  });

  btnFit.addEventListener('click', autofit);
  document.getElementById('btnDruck').addEventListener('click', function(){ window.print(); });
  window.addEventListener('resize', skalieren);

  /* Höhe an eine einbettende Seite melden */
  function hoeheMelden(){
    if(window.parent === window) return;
    try{ window.parent.postMessage({ speisekarteHoehe: document.body.scrollHeight }, '*'); }catch(e){}
  }
  if(window.parent !== window){
    hoeheMelden(); setTimeout(hoeheMelden, 600); setTimeout(hoeheMelden, 2200);
    window.addEventListener('resize', hoeheMelden);
  }

  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(function(){ skalieren(); pruefen(); });
  }
})();
</script>
</body>
</html>
